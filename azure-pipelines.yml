# Azure Pipelines configuration for Compassion Cloud
# Builds the ASP.NET Core web app and Azure Functions project on each commit

trigger:
  branches:
    include:
      - master
      - main
      - donations-feature
      - volunteer-feature

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solutionFile: '**/CompassionCloud.sln'

steps:
# ============================================================
# STEP 1: Install the .NET SDK
# ============================================================
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

# ============================================================
# STEP 2: Restore NuGet dependencies
# ============================================================
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(solutionFile)'
    feedsToUse: 'select'

# ============================================================
# STEP 3: Build the solution
# ============================================================
- task: DotNetCoreCLI@2
  displayName: 'Build solution in Release mode'
  inputs:
    command: 'build'
    projects: '$(solutionFile)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# ============================================================
# STEP 4: Run tests (placeholder - will succeed even if no tests exist)
# ============================================================
- task: DotNetCoreCLI@2
  displayName: 'Run unit tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'
  continueOnError: true

# ============================================================
# STEP 5: Publish the web app as an artifact (optional)
# ============================================================
- task: DotNetCoreCLI@2
  displayName: 'Publish web app'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/CompassionCloud.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/webapp --no-build'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Upload web app artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/webapp'
    ArtifactName: 'CompassionCloudWebApp'
    publishLocation: 'Container'