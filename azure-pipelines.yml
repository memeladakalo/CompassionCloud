# Azure Pipelines configuration for Compassion Cloud
# Triggers on every commit to the primary branch

trigger:
  branches:
    include:
      - master
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solutionFile: '**/CompassionCloud.sln'

steps:
# ------------------------------------------------------------
# 1. Install the .NET SDK
# ------------------------------------------------------------
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# ------------------------------------------------------------
# 2. Restore NuGet dependencies
# ------------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(solutionFile)'

# ------------------------------------------------------------
# 3. Build the solution
# ------------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '$(solutionFile)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# ------------------------------------------------------------
# 4. Run tests (optional, will not fail pipeline if none exist)
# ------------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: 'Run unit tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'
  continueOnError: true

# ------------------------------------------------------------
# 5. Publish web app as artifact (for later deployment)
# ------------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: 'Publish web app'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/CompassionCloud.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/webapp --no-build'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Upload web app artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/webapp'
    ArtifactName: 'CompassionCloudWebApp'
    publishLocation: 'Container'